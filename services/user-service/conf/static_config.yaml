components_manager:
    task_processors:
        main-task-processor:
            worker_threads: 4
        fs-task-processor:
            worker_threads: 2

    default_task_processor: main-task-processor

    components:
        server:
            listener:
                port: 8080
                task_processor: main-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: info
                    overflow_behavior: discard

        dynamic-config: {}
        testsuite-support: {}

        # JWT issuer / verifier. Secret/pepper come from env JWT_SECRET /
        # PASSWORD_PEPPER if set — see services/common/auth/auth_service.cpp.
        auth-service:
            jwt_secret: change-me-in-prod
            jwt_ttl_seconds: 3600
            password_pepper: taxi-svc-v1

        # Redis-backed cache + rate limiter (lab 5). Host/port overridable via
        # REDIS_HOST / REDIS_PORT env. Backends degrade gracefully if Redis
        # is unreachable — cache misses fall through to DB, rate-limit fails
        # open.
        redis-client:
            host: redis
            port: 6379
            connect_timeout_ms: 500
        rate-limiter: {}

        # Backend selector. Override with TAXI_DB_BACKEND=sqlite|postgres.
        user-repository:
            backend: sqlite
            sqlite:
                db_path: /data/users.db
            postgres:
                dsn: host=postgres port=5432 dbname=taxi user=taxi password=taxi
            mongo:
                uri: mongodb://taxi:taxi@mongo:27017/taxi?authSource=admin
                db_name: taxi

        handler-auth-login:
            path: /v1/login
            method: POST
            task_processor: main-task-processor

        handler-user-create:
            path: /v1/users
            method: POST
            task_processor: main-task-processor

        handler-user-get:
            path: /v1/users
            method: GET
            task_processor: main-task-processor
            auth:
                types:
                  - bearer

        handler-user-get-internal:
            path: /internal/users/{login}
            method: GET
            task_processor: main-task-processor
