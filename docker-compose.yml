# Single docker-compose for the taxi platform:
#   * nginx api-gateway (the only externally exposed entry point, :8080)
#   * three userver backends, reachable only on the docker-private network
#   * swagger-ui for browsing the OpenAPI spec
#
# All backend binaries live in the same image (built by ./Dockerfile); each
# compose service picks its binary + static_config via `command:`.
x-backend-base: &backend-base
  platform: linux/amd64
  image: taxi-services:latest
  restart: unless-stopped
  environment:
    JWT_SECRET: change-me-in-prod
    PASSWORD_PEPPER: taxi-svc-v1
services:

  api-gateway:
    image: nginx:1.27-alpine
    container_name: taxi-api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - driver-service
      - ride-service
    restart: unless-stopped

  user-service:
    <<: *backend-base
    build:                        # сборка только здесь
      context: .
      dockerfile: Dockerfile
    container_name: taxi-user-service
    command: ["/app/user_service",
              "--config", "/app/conf/user-service/static_config.yaml"]
    volumes:
      - taxi-users-data:/data    # shared with driver-service

  driver-service:
    <<: *backend-base
    container_name: taxi-driver-service
    command: ["/app/driver_service",
              "--config", "/app/conf/driver-service/static_config.yaml"]
    volumes:
      - taxi-users-data:/data    # shared with user-service

  ride-service:
    <<: *backend-base
    container_name: taxi-ride-service
    command: ["/app/ride_service",
              "--config", "/app/conf/ride-service/static_config.yaml"]
    volumes:
      - taxi-rides-data:/data

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: taxi-swagger-ui
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      BASE_URL: /
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  taxi-users-data:   # users.db — shared by user-service + driver-service
  taxi-rides-data:   # rides.db — owned by ride-service
