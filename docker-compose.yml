x-backend-base: &backend-base
  platform: linux/amd64
  image: taxi-services:latest
  restart: unless-stopped
  environment:
    JWT_SECRET: change-me-in-prod
    PASSWORD_PEPPER: taxi-svc-v1
    TAXI_DB_BACKEND: ${TAXI_DB_BACKEND:-postgres}
    TAXI_USER_DB_BACKEND: ${TAXI_USER_DB_BACKEND:-mongo}
    TAXI_DRIVER_DB_BACKEND: ${TAXI_DRIVER_DB_BACKEND:-}
    TAXI_RIDE_DB_BACKEND: ${TAXI_RIDE_DB_BACKEND:-}
    TAXI_POSTGRES_DSN: host=postgres port=5432 dbname=taxi user=taxi password=taxi
    TAXI_MONGO_URI: mongodb://taxi:taxi@mongo:27017/taxi?authSource=admin
    TAXI_MONGO_DB: taxi
services:

  postgres:
    image: postgres:16-alpine
    container_name: taxi-postgres
    environment:
      POSTGRES_DB: taxi
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taxi-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi -d taxi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: taxi-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: taxi
      MONGO_INITDB_ROOT_PASSWORD: taxi
      MONGO_INITDB_DATABASE: taxi
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - taxi-mongo-data:/data/db
      - ./mongodb/validation.js:/docker-entrypoint-initdb.d/01-validation.js:ro
      - ./mongodb/data.js:/docker-entrypoint-initdb.d/02-data.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api-gateway:
    image: nginx:1.27-alpine
    container_name: taxi-api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - driver-service
      - ride-service
    restart: unless-stopped

  user-service:
    <<: *backend-base
    build:        
      context: .
      dockerfile: Dockerfile
    container_name: taxi-user-service
    command: ["/app/user_service",
              "--config", "/app/conf/user-service/static_config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - taxi-users-data:/data 

  driver-service:
    <<: *backend-base
    container_name: taxi-driver-service
    command: ["/app/driver_service",
              "--config", "/app/conf/driver-service/static_config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - taxi-users-data:/data

  ride-service:
    <<: *backend-base
    container_name: taxi-ride-service
    command: ["/app/ride_service",
              "--config", "/app/conf/ride-service/static_config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - taxi-rides-data:/data

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: taxi-swagger-ui
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      BASE_URL: /
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  taxi-postgres-data:
  taxi-mongo-data:
  taxi-users-data: 
  taxi-rides-data:  
