x-backend-base: &backend-base
  platform: linux/amd64
  image: taxi-services:latest
  restart: unless-stopped
  environment:
    JWT_SECRET: change-me-in-prod
    PASSWORD_PEPPER: taxi-svc-v1
    TAXI_DB_BACKEND: ${TAXI_DB_BACKEND:-postgres}
    TAXI_USER_DB_BACKEND: ${TAXI_USER_DB_BACKEND:-postgres}
    TAXI_DRIVER_DB_BACKEND: ${TAXI_DRIVER_DB_BACKEND:-}
    TAXI_RIDE_DB_BACKEND: ${TAXI_RIDE_DB_BACKEND:-}
    TAXI_POSTGRES_DSN: host=postgres port=5432 dbname=taxi user=taxi password=taxi
    TAXI_MONGO_URI: mongodb://taxi:taxi@mongo:27017/taxi?authSource=admin
    TAXI_MONGO_DB: taxi
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-30}
    SECDIST_CONFIG: '{"kafka_settings":{"kafka-producer":{"brokers":"kafka:9092","username":"","password":""},"kafka-consumer":{"brokers":"kafka:9092","username":"","password":""}}}'
services:

  postgres:
    image: postgres:16-alpine
    container_name: taxi-postgres
    environment:
      POSTGRES_DB: taxi
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taxi-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi -d taxi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: taxi-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: taxi-kafka
    platform: linux/amd64
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: taxi-kafka-init
    platform: linux/amd64
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/bin/bash", "-c", "kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic taxi.events --partitions 1 --replication-factor 1"]
    restart: "no"

  mongo:
    image: mongo:7
    container_name: taxi-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: taxi
      MONGO_INITDB_ROOT_PASSWORD: taxi
      MONGO_INITDB_DATABASE: taxi
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - taxi-mongo-data:/data/db
      - ./mongodb/validation.js:/docker-entrypoint-initdb.d/01-validation.js:ro
      - ./mongodb/data.js:/docker-entrypoint-initdb.d/02-data.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api-gateway:
    image: nginx:1.27-alpine
    container_name: taxi-api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - driver-service
      - ride-service
      - event-service
    restart: unless-stopped

  user-service:
    <<: *backend-base
    build:        
      context: .
      dockerfile: Dockerfile
    container_name: taxi-user-service
    command: ["/app/user_service",
              "--config", "/app/conf/user-service/static_config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - taxi-users-data:/data 

  driver-service:
    <<: *backend-base
    container_name: taxi-driver-service
    command: ["/app/driver_service",
              "--config", "/app/conf/driver-service/static_config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - taxi-users-data:/data

  ride-service:
    <<: *backend-base
    container_name: taxi-ride-service
    command: ["/app/ride_service",
              "--config", "/app/conf/ride-service/static_config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - taxi-rides-data:/data

  event-service:
    <<: *backend-base
    container_name: taxi-event-service
    command: ["/app/event_service",
              "--config", "/app/conf/event-service/static_config.yaml"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: taxi-swagger-ui
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      BASE_URL: /
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  taxi-postgres-data:
  taxi-mongo-data:
  taxi-users-data: 
  taxi-rides-data:  
