upstream user_service   { server user-service:8080;   keepalive 16; }
upstream driver_service { server driver-service:8080; keepalive 16; }
upstream ride_service   { server ride-service:8080;   keepalive 16; }
upstream event_service  { server event-service:8080;  keepalive 16; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;
    add_header Access-Control-Max-Age 86400 always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location ^~ /internal/ {
        return 404;
    }

    location = /v1/login {
        proxy_pass http://user_service;
    }

    location ~ ^/v1/users/[^/]+/rides$ {
        proxy_pass http://ride_service;
    }

    location /v1/users {
        proxy_pass http://user_service;
    }

    location /v1/drivers {
        proxy_pass http://driver_service;
    }

    location /v1/rides {
        proxy_pass http://ride_service;
    }

    location /v1/events {
        proxy_pass http://event_service;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
